# FPR Calibration - Full Validation Configuration
#
# Validates that all methods maintain nominal FPR under null hypothesis.
#
# Usage:
#   # For full run (all methods, 1000 null datasets)
#   python syntetic_experiments/fpr/fpr_calibration.py --config syntetic_experiments/fpr/fpr_config.yaml
#
#   # Resume interrupted run
#   python syntetic_experiments/fpr/fpr_calibration.py --config syntetic_experiments/fpr/fpr_config.yaml --resume
#
#   # Override specific parameters
#   python syntetic_experiments/fpr/fpr_calibration.py --config syntetic_experiments/fpr/fpr_config.yaml --n-null 500
#
# Estimated runtime: ~4-8 hours with n_jobs=-1 (depending on hardware)
# Code consists of checkpointing, allowing for interruption and resumtion of computations.

# =============================================================================
# METHODS TO TEST
# =============================================================================

# All available methods for comprehensive validation
methods:
  - tstat           # Baseline: uncorrected t-statistics (edge-wise)
  - tfnbs           # Threshold-Free NBS (standard)
  - ni_tfnbs        # Network-Informed TFNBS
  - fbc_tfnbs       # FBC-weighted TFNBS
  - nbs_extent      # Classical NBS (cluster extent statistic)
  - nbs_intensity   # Classical NBS (cluster intensity statistic)
  - cnbs            # Constrained NBS (block-based)

# =============================================================================
# NULL SIMULATION PARAMETERS
# =============================================================================

# Number of null datasets (effect_size=0) to generate
# 1000 provides ~95% CI width of ~0.014 for FPR (Clopper-Pearson)
n_null: 1000

# Permutations per null test
# Higher = more accurate p-values, slower execution
n_permutations: 500

# Significance threshold (family-wise error rate for FWER-controlling methods)
alpha: 0.05

# =============================================================================
# DATA GENERATION PARAMETERS
# =============================================================================

# Network structure (matches typical fMRI analysis)
n_nodes: 60        # Typical for Schaefer 60-parcel or similar
n_modules: 4       # 4 major networks

# Subjects per group
n_samples: 20      # Typical small neuroimaging study

# Correlation structure (realistic for resting-state fMRI)
intra_corr: 0.3    # Within-module correlation (moderate)
inter_corr: 0.05   # Between-module correlation (weak)
noise_level: 0.05  # Noise added to correlations

# =============================================================================
# TFNBS PARAMETERS
# =============================================================================

# Standard TFCE parameters adapted for network analysis
tfnbs_e: 0.5              # Extent exponent (cluster size weighting)
tfnbs_h: 2.0              # Height exponent (t-statistic weighting)
tfnbs_n: 50               # Number of threshold integration steps
tfnbs_start_thres: 1.65   # Starting threshold (p < 0.05 one-tailed)

# =============================================================================
# NBS PARAMETERS
# =============================================================================

# Fixed threshold for classical NBS
nbs_threshold: 2.0

# =============================================================================
# FBC PARAMETERS
# =============================================================================

# Minimum cluster size for FBC scoring
fbc_min_cluster: 3

# =============================================================================
# EXECUTION OPTIONS
# =============================================================================

# Random seed for reproducibility
seed: 42

# Multiprocessing for permutations WITHIN each test
# Set to true if you want parallel permutations (useful when n_jobs=1)
# When n_jobs=-1, keep this false to avoid nested parallelism overhead
use_mp: false

# Parallel jobs for null runs ACROSS tests
# -1 = use all available cores (recommended for speed)
# 1 = sequential execution (lower memory, easier debugging)
# N = use exactly N cores
n_jobs: -1

# Checkpoint frequency (save every N runs)
# Lower = more frequent saves, slightly more I/O overhead
# Higher = less frequent saves, more work lost on interruption
checkpoint_every: 10

# =============================================================================
# OUTPUT
# =============================================================================

output_dir: results/fpr_calibration

# =============================================================================
# EXPECTED RESULTS
# =============================================================================
#
# For a well-calibrated method at alpha=0.05 with n_null=1000:
#   - Expected FPR: 0.050
#   - 95% CI width: ~0.014 (Clopper-Pearson)
#   - Acceptable range: approximately [0.036, 0.064]
#
# Methods should pass if their 95% CI contains alpha=0.05.
#
# Common issues:
#   - FPR > alpha: Method is LIBERAL (too many false positives)
#   - FPR < alpha: Method is CONSERVATIVE (may be OK, but loses power)
#   - Large variance: Unstable method, may need more permutations
#
# =============================================================================
