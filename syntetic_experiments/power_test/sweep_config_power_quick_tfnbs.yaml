# TFNBS Power Analysis Quick Config (TFNBS-only, parameter sweep)
#
# This config runs only TFNBS with a small sweep over (e, h).
# Run with: 
#     python syntetic_experiments/power_test/power_analysis.py --config syntetic_experiments/power_test/sweep_config_power_quick_tfnbs.yaml

effect_sizes:
  - 0.20
  - 0.30

n_samples: 20

sample_sizes:
  - 20
  - 30

effect_size: 0.25

scenarios:
  - within_module_dense
  - chain

methods:
  - tfnbs

n_repeats: 2
n_permutations: 50
alpha: 0.05

n_nodes: 30
n_modules: 3
time_points: 30

seed: 42
use_mp: false

tfnbs_options:
  e:
    - 0.4
    - 0.6
  h:
    - 1.0
    - 2.0
  n_thresholds: 10
  start_thres: 1.65

output_dir: results/power_analysis_quick_tfnbs
