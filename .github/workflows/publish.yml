name: Publish to PyPI

# Builds the package and tests it on every tag push.
# Tags ending in "-rcN" go to TestPyPI; bare "vX.Y.Z" tags go to real PyPI.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens, no secrets-in-CI.
# The `pypi` environment in repo Settings should require manual approval for
# real-PyPI publishes; `testpypi` runs automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Sanity-check artefacts
        run: |
          ls -la dist/
          # twine-check verifies the README renders correctly on PyPI
          pip install twine
          twine check dist/*

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m unittest discover tests

  publish-testpypi:
    needs: [build, test]
    if: contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/conninfpy
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - name: Download dist artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, test]
    if: ${{ !contains(github.ref, '-rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/conninfpy
    permissions:
      id-token: write
    steps:
      - name: Download dist artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
