# Mypy configuration for ConnInfPy.
#
# Strategy:
#   - The public API (every name re-exported from `conninfpy/__init__.py`)
#     is held to a stricter standard.
#   - Internal helpers (`_compat`, `_progress`, `_rng`, `_result`, `_analyze`)
#     use lighter checking — they're explicitly marked private and tested
#     end-to-end.
#   - Third-party packages without type stubs (scipy, sklearn, networkx,
#     mne, nilearn) are silenced.
#
# Current baseline (v2.0, 2026-05-03): ~47 errors, all in legacy-flagged
# functions or untyped local containers (e.g. ``max_stat = []`` followed
# by appends — mypy needs the explicit ``List[float]`` annotation).
# Public-facing return types and call signatures are clean.
#
# Run:
#   python -m mypy conninfpy
#
# Or just the public surface:
#   python -m mypy --follow-imports=silent conninfpy/__init__.py

[mypy]
python_version = 3.9
files = conninfpy
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
no_implicit_optional = True
check_untyped_defs = True

# Soft-strict baseline (errors are warnings; iteratively tighten over time).
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

# Silence missing stubs for scientific stack
[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-networkx.*]
ignore_missing_imports = True

[mypy-mne.*]
ignore_missing_imports = True

[mypy-nilearn.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-numba.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

# Internal helpers: lenient (private API, end-to-end tested).
[mypy-conninfpy._compat]
disallow_untyped_defs = False

[mypy-conninfpy._progress]
disallow_untyped_defs = False

[mypy-conninfpy._rng]
disallow_untyped_defs = False

[mypy-conninfpy._result]
disallow_untyped_defs = False

[mypy-conninfpy._analyze]
disallow_untyped_defs = False
