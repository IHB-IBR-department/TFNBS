# TFNBS Method Comparison - Full Parameter Sweep Configuration
#
# Usage:
#   python examples/sim_method_comparisons/batch_sweep_runner.py --config examples/sim_method_comparisons/sweep_config.yaml
#
# This config runs a comprehensive comparison across:
# - Multiple effect sizes (difficulty levels)
# - Key discriminative scenarios
# - Standard TFNBS/NBS parameters
#
# Estimated runtime: ~30-60 min with --use-mp

# =============================================================================
# DATA GENERATION PARAMETERS (sweep - each creates separate runs)
# =============================================================================

# Effect size sweep: weak to strong effects
# Lower values = harder to detect, tests method sensitivity
effect_size:
  - 0.15   # Weak effect
  - 0.20   # Moderate effect
  - 0.25   # Standard effect
  - 0.30   # Strong effect

# Time points per subject (affects t-stat magnitude)
time_points:
  - 50     # Standard

# Subjects per group
n_samples:
  - 20     # Standard

# Permutations for p-value estimation
# Higher = more accurate but slower
n_permutations:
  - 200    # Good balance for testing

# =============================================================================
# SCENARIO SELECTION
# =============================================================================

# Discriminative scenarios that stress-test different method properties:
scenarios:
  # Block-coherent effects (should favor cNBS, FBC)
  - within_module_dense
  - perfect_matching_within_module

  # Topologically-connected effects (should favor NBS, TFNBS)
  - chain
  - cross_block_connected_chain

  # Heterogeneous effects (should favor TFNBS)
  - gradient_effect_chain

  # Mixed/scattered effects (FP stress test)
  - scattered_cross_block

# Uncomment to run ALL scenarios (slower):
# all_scenarios: true

# -----------------------------------------------------------------------------
# ALL AVAILABLE SCENARIOS (uncomment to add):
# -----------------------------------------------------------------------------
# Block/modular effects:
#   - within_module_dense          # Dense block within one module
#   - between_modules_dense        # Dense block between two modules
#   - perfect_matching_within_module  # Non-adjacent edges in same block
#   - checkerboard_within_module   # Alternating pattern within module
#   - multi_cluster_within_module  # Multiple small clusters in module
#   - fragmented_within_module     # Fragmented edges within module
#   - uniform_base_modular_effect  # Uniform base + modular effect
#   - within_plus_between          # Both within and between module effects
#   - imbalanced_modules_within_effect  # Unequal module sizes
#
# Chain/path effects:
#   - chain                        # Simple chain across nodes
#   - cross_block_connected_chain  # Chain crossing module boundaries
#   - gradient_effect_chain        # Chain with varying effect strength
#
# Hub/centrality effects:
#   - hub                          # Star topology (central hub)
#   - rich_club                    # Densely connected hub nodes
#   - gradient_core_periphery_within_module  # Core-periphery gradient
#
# Clique effects:
#   - two_equal_disconnected_cliques  # Two separate cliques
#   - focal_clique_inside_module   # Small clique within module
#
# Cross-block effects:
#   - scattered_cross_block        # Scattered edges across blocks
#   - partial_bipartite_between_modules  # Bipartite between modules

# =============================================================================
# TFNBS PARAMETERS
# =============================================================================

# Extent exponent (cluster size weighting)
# Higher = more weight on large clusters
e:
  - 0.5    # Standard

# Height exponent (t-statistic weighting)
# Higher = more weight on strong edges
h:
  - 2.0    # Standard

# Number of threshold integration steps
n_thresholds:
  - 50

# Starting threshold (minimum t-value to consider)
# 1.65 ≈ p < 0.05 one-tailed
start_thres:
  - 1.65   # Standard

# =============================================================================
# NBS PARAMETERS
# =============================================================================

# Fixed threshold for classical NBS
# Lower = larger clusters, more FP risk
# Higher = smaller clusters, more FN risk
nbs_threshold:
  - 2.0    # Standard

# =============================================================================
# FBC PARAMETERS
# =============================================================================

# Minimum cluster size for FBC scoring
fbc_min_cluster:
  - 3      # Standard

# =============================================================================
# NETWORK STRUCTURE (fixed)
# =============================================================================

n_nodes: 60
n_modules: 4

# Correlation structure
intra_corr: 0.3      # Within-module correlation
inter_corr: 0.05     # Between-module correlation
uniform_corr: 0.15   # Uniform baseline correlation
noise_level: 0.05    # Noise added to correlations

# =============================================================================
# EXECUTION OPTIONS
# =============================================================================

# Random seed for reproducibility
seed: 42

# Significance level for TP/FP computation
alpha: 0.05

# Enable multiprocessing (recommended)
use_mp: true
# n_processes: 4  # Uncomment to limit processes

# Output directory
output_dir: examples/output/full_comparison

# =============================================================================
# BATCH MODE (optional - for TFNBS parameter sweeps)
# =============================================================================

# Uncomment to enable batch mode for faster e/h sweeps:
# batch_tfnbs_params: true
# e:
#   - 0.3
#   - 0.4
#   - 0.5
# h:
#   - 2.0
#   - 2.5
#   - 3.0
# Note: In batch mode, e and h must have EQUAL LENGTH (paired)