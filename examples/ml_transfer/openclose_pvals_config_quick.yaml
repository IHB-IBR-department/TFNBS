# Quick run config for OpenClose paired p-values
#
# Usage:
#   python examples/ml_transfer/openclose_pvals_runner.py --config examples/ml_transfer/openclose_pvals_config_quick.yaml

dataset: hcp
experiments:
  - ihb

test_type: paired
label_scheme: cole

methods:
  - tstat
  - tfnbs
  - nbs
  - fbc_tfnbs

n_permutations: 10
use_mp: false
random_state: 42
n_processes: null

tfnbs:
  e: [0.4, 0.6]
  h: [2.0, 3.0]
  n_thresholds: 10
  start_thres: 1.65

nbs:
  threshold: [2.0, 2.5]
  nbs_stat: [extent, intensity]

fbc_tfnbs:
  min_cluster_size: [2, 3]

save_t_signed: true
save_net_labels: true
output_dir: results/openclose_hcp/pvals_quick
