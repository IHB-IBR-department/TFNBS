# OpenClose paired p-value computation Preset
#
# Usage:
#   python examples/ml_transfer/openclose_pvals_runner.py --config examples/ml_transfer/openclose_pvals_config.yaml

dataset: hcp
experiments:
  - ihb
  - rmet

test_type: paired
label_scheme: cole  # hcp: cole or cortical, sch200: yeo7

methods:
  - tstat
  - tfnbs
  - nbs
  - cnbs
  - ni_tfnbs
  - fbc_tfnbs

n_permutations: 500
use_mp: true
random_state: 42
n_processes: null

# TFNBS-family parameters (tfnbs, ni_tfnbs, fbc_tfnbs)
# If e/h are lists, p-values are 3D (N, N, n_params)
# e and h must have the same length

tfnbs:
  e: [0.4, 0.4, 0.6, 0.6, 1., 1., 1.4, 1.4]
  h: [2.0, 4.0, 2.0, 4.0, 2.0, 4.0, 2.0, 4.0]
  n_thresholds: 10
  start_thres: 1.65

# NBS parameters
nbs:
  threshold: [2.0, 2.5, 3.0]
  nbs_stat: [extent, intensity]

# FBC-TFNBS parameters
fbc_tfnbs:
  min_cluster_size: [3, 5]

save_t_signed: true
save_net_labels: true
output_dir: results/openclose_hcp/pvals
