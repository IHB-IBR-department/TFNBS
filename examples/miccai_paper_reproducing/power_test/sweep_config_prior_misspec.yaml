# Prior Misspecification Experiment (Exp 2)
#
# Tests cNBS, NI-TFNBS, FBC-TFNBS with wrong block counts.
# Run 3 times with --label-override: true, 7blocks, 2blocks
#
# Usage:
#   for LABEL in true 7blocks 2blocks; do
#     python examples/power_test/power_analysis.py \
#       --config examples/power_test/sweep_config_prior_misspec.yaml \
#       --label-override $LABEL \
#       --output-dir results/prior_misspec_$LABEL \
#       --mode effect-size
#   done

effect_sizes:
  - 0.25
  - 0.50

n_samples: 30

scenarios:
  - hub
  - rich_club
  - chain
  - between_modules_dense

methods:
  - cnbs
  - ni_tfnbs
  - fbc_tfnbs
  - bh_fdr       # control (label-independent)
  - tfnbs        # control (label-independent)

tfnbs_options:
  e: [0.5]
  h: [2.0]
  n_thresholds: 30
  start_thres: 1.25
  fbc_min_cluster_size: 3

n_repeats: 10
n_permutations: 100
alpha: 0.05

n_nodes: 60
n_modules: 4
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05
seed: 42
