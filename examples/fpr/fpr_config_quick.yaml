# FPR Calibration - Quick Test Configuration
#
# This config is ideal for testing before full scale computation.
# 
# Usage:
#   python examples/fpr/fpr_calibration.py --config examples/fpr/fpr_config_quick.yaml
#
# Estimated runtime: ~2-5 min (depends on hardware)

# =============================================================================
# METHODS TO TEST
# =============================================================================

methods:
  - tstat           # Baseline: uncorrected t-statistics
  - tfnbs           # Threshold-free NBS
  - ni_tfnbs        # Network-Informed TFNBS
  - fbc_tfnbs       # FBC-weighted TFNBS
  - nbs_extent      # Classical NBS (cluster extent)
  - nbs_intensity   # Classical NBS (cluster intensity)
  - cnbs            # Constrained NBS (block-based)

# =============================================================================
# NULL SIMULATION PARAMETERS
# =============================================================================

# Number of null datasets (effect_size=0) to generate for quick testing
n_null: 20

# Permutations per null test
# Lower = faster but noisier p-values
n_permutations: 100

# Significance threshold
alpha: 0.05

# =============================================================================
# DATA GENERATION PARAMETERS
# =============================================================================

# Network structure
n_nodes: 40        # Smaller network for speed
n_modules: 4

# Subjects per group
n_samples: 15

# Correlation structure
intra_corr: 0.3    # Within-module correlation
inter_corr: 0.05   # Between-module correlation
noise_level: 0.05  # Noise added to correlations

# =============================================================================
# TFNBS PARAMETERS
# =============================================================================

tfnbs_e: 0.5              # Extent exponent
tfnbs_h: 2.0              # Height exponent
tfnbs_n: 30               # Number of thresholds (fewer for speed)
tfnbs_start_thres: 1.65   # Starting threshold (p < 0.05 one-tailed)

# =============================================================================
# NBS PARAMETERS
# =============================================================================

nbs_threshold: 2.0

# =============================================================================
# FBC PARAMETERS
# =============================================================================

fbc_min_cluster: 3

# =============================================================================
# EXECUTION OPTIONS
# =============================================================================

# Random seed for reproducibility
seed: 42

# Multiprocessing for permutations within each test
use_mp: false

# Parallel jobs for null runs (-1 = all cores, 1 = sequential)
# Use -1 for maximum speed
n_jobs: -1

# Checkpoint frequency (save every N runs per method)
checkpoint_every: 5

# =============================================================================
# OUTPUT
# =============================================================================

output_dir: results/fpr_calibration_quick
