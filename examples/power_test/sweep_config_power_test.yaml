# TFNBS Power Analysis - Test Configuration
#
# Minimal config for testing power_analysis.py functionality.
# Very fast execution (~1-2 min) to verify code works correctly.
#
# Usage:
#   python examples/power_test/power_analysis.py --config examples/power_test/sweep_config_power_test.yaml

# =============================================================================
# EFFECT SIZE ANALYSIS (FOR TESTING)
# =============================================================================

effect_sizes:
  - 0.20
  - 0.35

n_samples: 15

# =============================================================================
# SAMPLE SIZE ANALYSIS (FOR TESTING)
# =============================================================================

sample_sizes:
  - 15
  - 25

effect_size: 0.25

# =============================================================================
# SCENARIOS (FOR TESTING)
# =============================================================================

scenarios:
  - within_module_dense
  - hub

# =============================================================================
# METHODS (FOR TESTING)
# =============================================================================

methods:
  - tstat
  - tfnbs
  - nbs_extent

# =============================================================================
# METHOD OPTIONS (single config, no sweep)
# =============================================================================

tfnbs_options:
  e: 0.5
  h: 2.0
  n_thresholds: 10
  start_thres: 1.65

nbs_options:
  threshold: 2.0

# =============================================================================
# SIMULATION PARAMETERS (FOR TESTING)
# =============================================================================

n_repeats: 3
n_permutations: 50
alpha: 0.05

# =============================================================================
# NETWORK STRUCTURE (FOR TESTING)
# =============================================================================

n_nodes: 30
n_modules: 3
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05

# =============================================================================
# EXECUTION (FOR TESTING)
# =============================================================================

seed: 42
use_mp: false
output_dir: results/power_analysis_test