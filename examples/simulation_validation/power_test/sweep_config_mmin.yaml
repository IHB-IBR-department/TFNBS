# FBC-TFNBS m_min Sensitivity Experiment (Exp 3)
#
# Sweeps min_cluster_size in {1, 2, 3, 5, 10} for FBC-TFNBS.
# Run 5 times with --fbc-min-cluster: 1, 2, 3, 5, 10
#
# Usage:
#   for M in 1 2 3 5 10; do
#     python examples/power_test/power_analysis.py \
#       --config examples/power_test/sweep_config_mmin.yaml \
#       --fbc-min-cluster $M \
#       --output-dir examples/simulation_validation/results/mmin_$M \
#       --mode effect-size
#   done

effect_sizes:
  - 0.25
  - 0.50

n_samples: 30

scenarios:
  - hub
  - rich_club
  - chain
  - between_modules_dense

methods:
  - fbc_tfnbs

tfnbs_options:
  e: [0.5]
  h: [2.0]
  n_thresholds: 30
  start_thres: 1.25
  fbc_min_cluster_size: 3   # overridden by --fbc-min-cluster CLI

n_repeats: 10
n_permutations: 100
alpha: 0.05

n_nodes: 60
n_modules: 4
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05
seed: 42
