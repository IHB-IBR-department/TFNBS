# FWER Calibration - Full Validation Configuration
#
# Validates that all methods maintain nominal directional FWER under null
# hypothesis. Edge-wise FPR is reported only as a secondary diagnostic.
#
# Usage:
#   # For full run (all methods, 1000 null datasets)
#   python examples/fpr/fpr_calibration.py --config examples/fpr/fpr_config_server_run.yaml
#
#   # Resume interrupted run
#   python examples/fpr/fpr_calibration.py --config examples/fpr/fpr_config_server_run.yaml --resume
#
#   # Override specific parameters
#   python examples/fpr/fpr_calibration.py --config examples/fpr/fpr_config_server_run.yaml --n-null 500
#
# Estimated runtime: ~4-8 hours with n_jobs=-1 (depending on hardware)
# Code consists of checkpointing, allowing for interruption and resumtion of computations.

# =============================================================================
# METHODS TO TEST
# =============================================================================

# All available methods for comprehensive validation
methods:
  - tstat           # Baseline: uncorrected t-statistics (edge-wise)
  - tfnbs           # Threshold-Free NBS (standard; E=0.4, H=3.0)
  - ni_tfnbs        # Network-Informed TFNBS (E=0.4, H=3.0)
  - fbc_tfnbs       # FBC-weighted TFNBS (E=0.4, H=3.0)
  - nbs_extent_2.0      # Classical NBS extent, threshold=2.0
  - nbs_intensity_2.0   # Classical NBS intensity, threshold=2.0
  - nbs_extent_3.0      # Classical NBS extent, threshold=3.0
  - nbs_intensity_3.0   # Classical NBS intensity, threshold=3.0
  - cnbs            # Constrained NBS (block-based)
  - bonferroni      # Parametric Bonferroni correction
  - bh_fdr          # Parametric Benjamini-Hochberg FDR

# =============================================================================
# NULL SIMULATION PARAMETERS
# =============================================================================

# Number of null datasets (effect_size=0) to generate
# 1000 provides ~95% CI width of ~0.014 for FPR (Clopper-Pearson)
n_null: 100

# Permutations per null test
# Higher = more accurate p-values, slower execution
n_permutations: 1000

# Significance threshold for each directional family. For a two-sided
# positive-or-negative family, use alpha/2 per tail when interpreting results.
alpha: 0.05

# =============================================================================
# DATA GENERATION PARAMETERS
# =============================================================================

# Network structure (matches typical fMRI analysis)
n_nodes: 60        # Typical for Schaefer 60-parcel or similar
n_modules: 4       # 4 major networks

# Subjects per group — sweep over multiple sizes
n_samples: 30      # default fallback if sample_sizes is unset
sample_sizes: [10, 30, 50, 100]   # full sample-size sweep, matches prior run

# Correlation structure (realistic for resting-state fMRI)
intra_corr: 0.3    # Within-module correlation (moderate)
inter_corr: 0.05   # Between-module correlation (weak)
noise_level: 0.05  # Noise added to correlations

# =============================================================================
# TFNBS PARAMETERS
# =============================================================================

# FPR calibration uses the same canonical TFNBS parameters as the real-data
# validation suites (ABIDE and Open-Close): E=0.4, H=3.0. For FPR
# calibration we want one canonical (E,H) per summary row; scan (E,H)
# sensitivity through power_analysis.py, where grid mode is batched.
tfnbs_e: 0.4
tfnbs_h: 3.0
tfnbs_n: 50               # Number of threshold integration steps
tfnbs_start_thres: 1.65   # Starting threshold (p < 0.05 one-tailed)

# =============================================================================
# NBS PARAMETERS
# =============================================================================

# Fallback threshold for legacy method names nbs_extent / nbs_intensity.
# The method list above explicitly includes threshold=2.0 and threshold=3.0
# variants, matching the real-data method comparisons.
nbs_threshold: 2.0

# =============================================================================
# FBC PARAMETERS
# =============================================================================

# Minimum cluster size for FBC scoring
fbc_min_cluster: 3

# =============================================================================
# EXECUTION OPTIONS
# =============================================================================

# Random seed for reproducibility
seed: 42

# Multiprocessing for permutations WITHIN each test
# Keep false; outer-level n_jobs=-1 already saturates cores. Nested mp.Pool
# adds overhead and oversubscribes the CPU.
use_mp: false

# Parallel jobs for null runs ACROSS tests
# -1 = use all available cores (recommended for speed; ~30-60 min for 1000 nulls × 4 sample sizes)
# 1 = sequential execution (slow but easier debugging)
n_jobs: -1

# Checkpoint frequency (save every N runs)
# Lower = more frequent saves, slightly more I/O overhead
# Higher = less frequent saves, more work lost on interruption
checkpoint_every: 20

# =============================================================================
# OUTPUT
# =============================================================================

output_dir: examples/simulation_validation/results/calibration/fpr_calibration_1000

# =============================================================================
# EXPECTED RESULTS
# =============================================================================
#
# For a well-calibrated directional FWER method at alpha=0.05 with n_null=1000:
#   - Expected directional FWER: <= 0.050
#   - 95% CI width: ~0.014 (Clopper-Pearson)
#   - Acceptable range: approximately [0.036, 0.064]
#
# Methods should pass if the lower bound of their 95% CI does not exceed
# alpha=0.05. Values below alpha are conservative, not invalid.
#
# Common issues:
#   - Directional FWER > alpha: Method may be LIBERAL (too many null runs
#     with at least one false-positive edge)
#   - Directional FWER < alpha: Method is CONSERVATIVE (valid, less powerful)
#   - Large variance: Unstable method, may need more permutations
#
# =============================================================================
