# GLM Validation - Paper Configuration
#
# Adds GLM-mode validation to the simulation suite:
#   1. Null FWER calibration for a continuous tested regressor.
#   2. Power for a continuous covariate with known topological effects.
#
# Usage:
#   python examples/simulation_validation/glm/glm_validation.py \
#     --config examples/simulation_validation/configs/glm_config_1000.yaml

mode: all

methods:
  - tstat
  - tfnbs
  - ni_tfnbs
  - fbc_tfnbs
  - nbs_extent_2.0
  - nbs_intensity_2.0
  - nbs_extent_3.0
  - nbs_intensity_3.0
  - cnbs
  - bonferroni
  - bh_fdr

# Null FWER calibration
n_null: 100
sample_sizes: [30, 60, 100]

# Continuous-covariate power
n_repeats: 30
n_subjects: 60
effect_sizes: [0.10, 0.20, 0.30]
scenarios:
  - within_module_dense
  - between_modules_dense
  - hub
  - chain
  - scattered_cross_block

# Inference
n_permutations: 1000
alpha: 0.05
n_jobs: -1
use_mp: false
seed: 42

# Network/data generation
n_nodes: 60
n_modules: 4
time_points: 30
intra_corr: 0.3
inter_corr: 0.05
uniform_corr: 0.15
noise_level: 0.05

# GLM covariates
interest_confound_corr: 0.3
confound_effect_size: 0.15
confound_scenario: between_modules_dense

# Method parameters: matches real-data and synthetic validation defaults
tfnbs_e: 0.4
tfnbs_h: 3.0
tfnbs_n: 50
tfnbs_start_thres: 1.65
nbs_threshold: 2.0
fbc_min_cluster: 3

output_dir: examples/simulation_validation/results/calibration/glm_validation_1000
