# FWER Calibration - Quick Test Configuration
#
# This config is ideal for testing before full scale computation.
# 
# Usage:
#   python examples/fpr/fpr_calibration.py --config examples/fpr/fpr_config_quick.yaml
#
# Estimated runtime: ~2-5 min (depends on hardware)

# =============================================================================
# METHODS TO TEST
# =============================================================================

methods:
  - tstat           # Baseline: uncorrected t-statistics
  - tfnbs           # Threshold-free NBS (E=0.3, H=3.0)
  - ni_tfnbs        # Network-Informed TFNBS (E=0.3, H=3.0)
  - fbc_tfnbs       # FBC-weighted TFNBS (E=0.3, H=3.0)
  - nbs_extent_2.0      # Classical NBS extent, threshold=2.0
  - nbs_intensity_2.0   # Classical NBS intensity, threshold=2.0
  - nbs_extent_3.0      # Classical NBS extent, threshold=3.0
  - nbs_intensity_3.0   # Classical NBS intensity, threshold=3.0
  - cnbs            # Constrained NBS (block-based)
  - bonferroni      # Parametric Bonferroni correction
  - bh_fdr          # Parametric Benjamini-Hochberg FDR

# =============================================================================
# NULL SIMULATION PARAMETERS
# =============================================================================

# Number of null datasets (effect_size=0) to generate for quick testing
n_null: 20

# Permutations per null test
# Lower = faster but noisier p-values
n_permutations: 100

# Directional family-wise significance threshold. For a two-sided
# positive-or-negative family, interpret with alpha/2 per tail.
alpha: 0.05

# =============================================================================
# DATA GENERATION PARAMETERS
# =============================================================================

# Network structure
n_nodes: 40        # Smaller network for speed
n_modules: 4

# Subjects per group
n_samples: 15

# Correlation structure
intra_corr: 0.3    # Within-module correlation
inter_corr: 0.05   # Between-module correlation
noise_level: 0.05  # Noise added to correlations

# =============================================================================
# TFNBS PARAMETERS
# =============================================================================

tfnbs_e: 0.3              # Extent exponent; matches real-data validation
tfnbs_h: 3.0              # Height exponent; matches real-data validation
tfnbs_n: 30               # Number of thresholds (fewer for speed)
tfnbs_start_thres: 1.65   # Starting threshold (p < 0.05 one-tailed)

# =============================================================================
# NBS PARAMETERS
# =============================================================================

nbs_threshold: 2.0        # Fallback for legacy nbs_extent/nbs_intensity names

# =============================================================================
# FBC PARAMETERS
# =============================================================================

fbc_min_cluster: 3

# =============================================================================
# EXECUTION OPTIONS
# =============================================================================

# Random seed for reproducibility
seed: 42

# Multiprocessing for permutations within each test
use_mp: false

# Parallel jobs for null runs (-1 = all cores, 1 = sequential)
# Use -1 for maximum speed
n_jobs: -1

# Checkpoint frequency (save every N runs per method)
checkpoint_every: 5

# =============================================================================
# OUTPUT
# =============================================================================

output_dir: examples/simulation_validation/results/fpr_calibration_quick
