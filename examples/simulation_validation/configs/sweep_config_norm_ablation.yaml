# NI-TFNBS Normalization Ablation Experiment (Exp 4)
#
# Compares 3 normalization variants: sqrt, linear, none.
# Run 3 times with --ni-normalization: sqrt, linear, none
#
# Usage:
#   for NORM in sqrt linear none; do
#     python examples/simulation_validation/power/power_analysis.py \
#       --config examples/simulation_validation/configs/sweep_config_norm_ablation.yaml \
#       --ni-normalization $NORM \
#       --output-dir examples/simulation_validation/results/norm_$NORM \
#       --mode effect-size
#   done

effect_sizes:
  - 0.25
  - 0.50

n_samples: 30

scenarios:
  - hub
  - rich_club
  - chain
  - between_modules_dense

methods:
  - ni_tfnbs
  - tfnbs        # control (no block weighting)
  - bh_fdr       # control (parametric)

tfnbs_options:
  e: [0.3]
  h: [3.0]
  n_thresholds: 30
  start_thres: 1.25

n_repeats: 10
n_permutations: 100
alpha: 0.05

n_nodes: 60
n_modules: 4
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05
seed: 42
