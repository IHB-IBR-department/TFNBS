[metadata]
name = conninfpy
version = 2.0.0
author = Irina Knyazeva
author_email = knyazeva@ihb.spb.ru
maintainer = Irina Knyazeva
maintainer_email = knyazeva@ihb.spb.ru
description = Unified Python framework for permutation-based statistical inference on brain connectivity networks
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/IHB-IBR-department/ConnInfPy
project_urls =
    Documentation = https://ihb-ibr-department.github.io/ConnInfPy/
    Source = https://github.com/IHB-IBR-department/ConnInfPy
    Issue Tracker = https://github.com/IHB-IBR-department/ConnInfPy/issues
license = MIT
license_files = LICENSE
keywords = neuroimaging, connectivity, fmri, eeg, network-based-statistics, tfnbs, glm, permutation-testing, fwer, fdr, combat
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Bio-Informatics
    Topic :: Scientific/Engineering :: Medical Science Apps.
    Topic :: Scientific/Engineering :: Mathematics

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.8
install_requires =
    numpy
    scipy
    statsmodels
    pandas
    matplotlib

[options.packages.find]
where = .

[options.package_data]
conninfpy = data/*.csv

[options.extras_require]
full =
    scikit-learn
    pyyaml
    networkx
dev =
    pytest
    sphinx
    sphinx-rtd-theme
    myst-parser
    seaborn
    mypy
    numba
    scikit-learn
    pyyaml
    networkx
notebooks =
    jupyter
    ipykernel
    seaborn
fast =
    numba
